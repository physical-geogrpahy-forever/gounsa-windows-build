name: SHETRAN actual fourth-field TMAX native 14-112s convergence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shetran_actual_tmax_ultrafine_20261027.yml'
      - 'experiments/shetran_dt_ultrafine_20261027.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-true-ultrafine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nclwater/Shetran
          ref: cf9cd540add78ad3accbaf62b4199d2032887f6b
          path: original
      - uses: actions/checkout@v4
        with:
          path: audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check fypp numpy h5py
      - name: Add independent original substep conservation WRITE only
        run: python audit/experiments/shetran_instrument_sediment_qa_20261027.py original/src/sediment/SYmod.f90
      - name: Build pristine physical equations
        working-directory: original
        run: |
          export FFLAGS="-ffree-line-length-none"
          ./build.sh -c gfortran -t Debug -j 2
      - name: Native 4m true TMAX 0.03125 to 0.003906h, fixed PMAX 1mm BSOFT false
        run: |
          python audit/experiments/shetran_dt_ultrafine_20261027.py \
            --original-model original/examples/Cobres/model \
            --exe original/build/debug/bin/shetran \
            --out /tmp/gounsa_shetran_ultrafine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shatran-ultrafine-true-TMAX-QA
          path: |
            /tmp/gounsa_shetran_ultrafine/ultrafine_dt_comparison.json
            /tmp/gounsa_shetran_ultrafine/*/qa_dt.json
            /tmp/gounsa_shetran_ultrafine/*/native_log.txt
          retention-days: 30
          if-no-files-found: warn
