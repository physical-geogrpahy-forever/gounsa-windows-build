name: Build Gounsa LPJ-GUESS 4.1.1 Windows CLI

on:
  pull_request:
    branches: [main]
    paths:
      - 'CI_OBSERVE_v038.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Reconstruct verified Gounsa patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem patch_chunks\part_*.b64 | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 patch chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [System.IO.File]::WriteAllBytes('GOUNSA_LPJ411_REBASE_v0_38_FULL.patch',[Convert]::FromBase64String($b64))
          $patchHash = (Get-FileHash GOUNSA_LPJ411_REBASE_v0_38_FULL.patch -Algorithm SHA256).Hash.ToLower()
          $expectedPatch = '215f86f2b2b9ed36ffcc87ae3abc465e363b3808a0720c6337e32d91407c532d'
          if ($patchHash -ne $expectedPatch) { throw "Patch SHA mismatch: $patchHash" }
          Write-Host "Patch SHA verified: $patchHash"

      - name: Download and verify official LPJ-GUESS 4.1.1
        shell: pwsh
        run: |
          $url = 'https://zenodo.org/records/8065737/files/guess_4.1.1.zip?download=1'
          curl.exe -L --fail --retry 3 --retry-delay 5 -o guess_4.1.1.zip $url
          if ($LASTEXITCODE -ne 0) { throw 'Zenodo download failed' }
          $upstreamHash = (Get-FileHash guess_4.1.1.zip -Algorithm SHA256).Hash.ToLower()
          $expectedUpstream = '9d30881c180bd2d291fea0a5d7e7cf22fc33512bf4c99b452722d4d8d3d8f193'
          if ($upstreamHash -ne $expectedUpstream) { throw "Upstream SHA mismatch: $upstreamHash" }
          Expand-Archive guess_4.1.1.zip -DestinationPath upstream
          if (!(Test-Path upstream\guess_4.1\CMakeLists.txt)) { throw 'LPJ-GUESS source root not found after extraction' }
          Write-Host "Official upstream SHA verified: $upstreamHash"

      - name: Apply Gounsa patch and verify markers
        shell: pwsh
        run: |
          Push-Location upstream
          git apply --check ..\GOUNSA_LPJ411_REBASE_v0_38_FULL.patch
          if ($LASTEXITCODE -ne 0) { throw 'Gounsa patch check failed' }
          git apply --whitespace=nowarn ..\GOUNSA_LPJ411_REBASE_v0_38_FULL.patch
          if ($LASTEXITCODE -ne 0) { throw 'Gounsa patch apply failed' }
          Pop-Location
          $markers = @(
            'upstream\guess_4.1\modules\veslemexchangeoutput.cpp',
            'upstream\guess_4.1\modules\gounsacohortoutput.cpp',
            'upstream\guess_4.1\modules\gounsa_direct_initial_state.cpp'
          )
          foreach ($m in $markers) { if (!(Test-Path $m)) { throw "Patched source marker missing: $m" } }

      - name: Prepare pinned isolated vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg-gounsa'
          if (Test-Path $vcpkg) { Remove-Item $vcpkg -Recurse -Force }
          git init $vcpkg
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg git init failed' }
          git -C $vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C $vcpkg fetch --depth 1 origin 06d00ffa491e4668627728f14b891d22c6fea146
          if ($LASTEXITCODE -ne 0) { throw 'Pinned vcpkg fetch failed' }
          git -C $vcpkg checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned vcpkg checkout failed' }
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          "VCPKG_GOUNSA=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Isolated vcpkg ready at $vcpkg"

      - name: Install NetCDF C
        shell: pwsh
        run: |
          & "$env:VCPKG_GOUNSA\vcpkg.exe" install netcdf-c:x64-windows --disable-metrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg netcdf-c install failed' }

      - name: Configure LPJ-GUESS
        shell: pwsh
        run: |
          $toolchain = "$($env:VCPKG_GOUNSA -replace '\\','/')/scripts/buildsystems/vcpkg.cmake"
          cmake -S upstream\guess_4.1 -B build-win64 `
            -G "Visual Studio 17 2022" -A x64 `
            -DUNIT_TESTS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }

      - name: Require NetCDF detection
        shell: pwsh
        run: |
          $cache = Get-Content build-win64\CMakeCache.txt -Raw
          if ($cache -match 'NETCDF_C_LIBRARY:FILEPATH=.*NOTFOUND') { throw 'NetCDF C library was not detected' }
          if ($cache -match 'NETCDF_INCLUDE_DIR:PATH=.*NOTFOUND') { throw 'NetCDF include directory was not detected' }
          if ($cache -notmatch 'NETCDF_C_LIBRARY:FILEPATH=') { throw 'NetCDF C library cache entry is missing' }
          if ($cache -notmatch 'NETCDF_INCLUDE_DIR:PATH=') { throw 'NetCDF include cache entry is missing' }

      - name: Build guesscmd.exe
        shell: pwsh
        run: |
          cmake --build build-win64 --config Release --target guesscmd -- /m
          if ($LASTEXITCODE -ne 0) { throw 'guesscmd build failed' }
          if (!(Test-Path build-win64\Release\guesscmd.exe)) { throw 'guesscmd.exe was not produced' }

      - name: Verify PE and dependencies
        shell: pwsh
        run: |
          $exe = (Resolve-Path build-win64\Release\guesscmd.exe).Path
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'guesscmd.exe is not a Windows PE/MZ executable' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$dumpbin) { throw 'dumpbin.exe not found' }
          & $dumpbin.FullName /dependents $exe | Tee-Object -FilePath dependents.txt
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin dependency inspection failed' }

      - name: Assemble portable native bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact\bin | Out-Null
          Copy-Item build-win64\Release\guesscmd.exe artifact\bin\guesscmd.exe
          Copy-Item "$env:VCPKG_GOUNSA\installed\x64-windows\bin\*.dll" artifact\bin\ -Force
          Copy-Item dependents.txt artifact\dependents.txt
          Copy-Item GOUNSA_LPJ411_REBASE_v0_38_FULL.patch artifact\GOUNSA_LPJ411_REBASE_v0_38.patch
          Get-FileHash artifact\bin\guesscmd.exe -Algorithm SHA256 | Format-List | Out-File artifact\guesscmd_sha256.txt -Encoding utf8
          Get-ChildItem artifact\bin | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Out-File artifact\bundle_contents.txt -Encoding utf8

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gounsa-lpjguess411-windows-x64-native
          path: artifact
          if-no-files-found: error
          retention-days: 14
