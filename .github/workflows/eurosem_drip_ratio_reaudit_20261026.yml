name: EUROSEM 1998 original versus drip ratio correction
on:
  push:
    branches: [swehr-water-sediment-closure-20261026]
    paths:
      - ".github/workflows/eurosem_drip_ratio_reaudit_20261026.yml"
      - "experiments/rainfall_10_50/run_eurosem_bug_reaudit_20261026.py"
      - "experiments/rainfall_10_50/verify_eurosem_reaudit_20261026.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_pair_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        subset: [main, mcode0]
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: sudo apt-get update -qq && sudo apt-get install -y gfortran
      - name: Re-run native full EUROSEM and revised isolated physical equation
        run: python3 experiments/rainfall_10_50/run_eurosem_bug_reaudit_20261026.py --subset ${{ matrix.subset }}
      - name: Archive native output, source traces and water budget
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eurosem-1998-original-dripratio-recheck-${{ matrix.subset }}
          path: |
            experiments/rainfall_10_50/eurosem_reaudit_20261026/*.csv
            experiments/rainfall_10_50/eurosem_reaudit_20261026/*.json
            experiments/rainfall_10_50/eurosem_QA_*/qa_result.json
            experiments/rainfall_10_50/eurosem_QA_*/console.log
            experiments/rainfall_10_50/eurosem_QA_*/static.log
            experiments/rainfall_10_50/eurosem_QA_*/dynamic.log
          retention-days: 21
