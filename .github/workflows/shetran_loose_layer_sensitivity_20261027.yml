name: SHETRAN original 0-30mm mobile sediment initial bed sensitivity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shetran_loose_layer_sensitivity_20261027.yml'
      - 'experiments/shetran_loose_layer_sensitivity_20261027.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-initial-layer-sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nclwater/Shetran
          ref: cf9cd540add78ad3accbaf62b4199d2032887f6b
          path: original
      - uses: actions/checkout@v4
        with:
          path: audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check fypp numpy h5py
      - name: Add sediment diagnostics to original Fortran without changing processes
        run: python audit/experiments/shetran_instrument_sediment_qa_20261027.py original/src/sediment/SYmod.f90
      - name: Build SHETRAN original process algorithms
        working-directory: original
        run: |
          export FFLAGS="-ffree-line-length-none"
          ./build.sh -c gfortran -t Debug -j 2
      - name: Run 8 native sediment starting-bed experiments
        run: |
          python audit/experiments/shetran_loose_layer_sensitivity_20261027.py \
            --original-model original/examples/Cobres/model \
            --exe original/build/debug/bin/shetran \
            --out /tmp/gounsa_shetran_initial_loose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shetran-original-loose-layer-sensitivity
          path: |
            /tmp/gounsa_shetran_initial_loose/all_initial_loose_layer_tests.json
            /tmp/gounsa_shetran_initial_loose/*/one_case.json
            /tmp/gounsa_shetran_initial_loose/*/native_log.txt
          retention-days: 30
          if-no-files-found: warn
