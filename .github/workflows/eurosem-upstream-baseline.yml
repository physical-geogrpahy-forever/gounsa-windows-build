name: EUROSEM 1998 original archive compatibility test
on:
  push:
    branches: [eurosem-single-model-lai-20261025]
    paths: ['.github/workflows/eurosem-upstream-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eurosem-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch archived source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/TheSoilman/EUROSEM.git eurosem-original
          git -C eurosem-original rev-parse HEAD | tee upstream-version.txt
      - name: Build original physics unchanged
        shell: bash
        run: |
          set -euo pipefail
          cd eurosem-original
          python3 -c "from pathlib import Path; [(p.write_bytes(p.read_bytes().replace(bytes([26]),b'')),print('NORMALIZED',p.name)) for p in Path('.').glob('*.for')]"
          gfortran -std=legacy -fallow-argument-mismatch -ffixed-line-length-72 -fno-range-check -O0 -g -fcheck=all -fbacktrace -w Euroa.for emainl.for eplanel.for eurozl.for eurseml.for eusedl.for -o eurosem.exe
      - name: Correct archived example topology and run
        shell: bash
        run: |
          set -euo pipefail
          cd eurosem-original
          cp test.par test.original.par
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test.par')
          src=p.read_text()
          lines=src.splitlines()
          match=[i for i,t in enumerate(lines) if t.split()==['2','0','0','0','0','0','0']]
          assert len(match)==1,match
          lines[match[0]]=' 2      1         0        0        0        0       0'
          p.write_text('\n'.join(lines)+'\n')
          print('CHANGED_EXAMPLE_ONLY_FROM',src.splitlines()[match[0]])
          print('CHANGED_EXAMPLE_ONLY_TO',lines[match[0]])
          PY
          printf '\nEUROSEM corrected example\nn\ntest.par\ntest.pcp\nstat.out\ndyn.out\ndiag.out\nn\n' > stdin.txt
          set +e
          timeout 60s ./eurosem.exe < stdin.txt > ../eurosem.stdout.log 2>&1
          code=$?
          set -e
          echo "EUROSEM_EXIT=$code"
          tail -80 ../eurosem.stdout.log
          if [ "$code" -ne 0 ]; then exit "$code"; fi
      - name: Inspect generated process output
        shell: bash
        run: |
          set -euo pipefail
          cd eurosem-original
          ls -lh *.out
          grep -n -i -m 10 'INTERCEPTION\| STEM \| DRIP ' diag.out || true
          test -s diag.out
      - name: Archive native results and corrected inputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eurosem-original-gfortran-sample-reproduction
          path: |
            upstream-version.txt
            eurosem.stdout.log
            eurosem-original/test.par
            eurosem-original/test.original.par
            eurosem-original/test.pcp
            eurosem-original/diag.out
            eurosem-original/dyn.out
            eurosem-original/stat.out
            eurosem-original/stdin.txt
          if-no-files-found: warn
          retention-days: 21
