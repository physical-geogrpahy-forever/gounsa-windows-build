name: Validate Gounsa v0.60 per-cell forcing restart

on:
  pull_request:
    branches: [v059-normalized-backbone]
    paths: ['v060_patch/**', 'v060_ci_fixture/**', '.github/workflows/validate_v060_per_cell_restart.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-native-restart-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake curl unzip libnetcdf-dev

      - name: Reconstruct official v0.59 normalized source
        shell: bash
        run: |
          set -euo pipefail
          cat v059_patch/part_00.b64 v059_patch/part_01.b64 | tr -d '\r\n' | base64 --decode > v059.patch.gz
          echo '717b0a2c4efbf2e4bbd4997f5f89020750e0a3d90a11125db9e8c480b115cdb5  v059.patch.gz' | sha256sum -c -
          gzip -dc v059.patch.gz > v059.patch
          echo 'a4c8a93775b0975db9d3075833f2df83d79844572425e9132ab216dcfc6605b4  v059.patch' | sha256sum -c -
          curl -L --fail --retry 3 --retry-delay 5 -o guess_4.1.1.zip 'https://zenodo.org/records/8065737/files/guess_4.1.1.zip?download=1'
          echo '9d30881c180bd2d291fea0a5d7e7cf22fc33512bf4c99b452722d4d8d3d8f193  guess_4.1.1.zip' | sha256sum -c -
          unzip -q guess_4.1.1.zip -d upstream
          cd upstream
          git init -q
          git apply --check --ignore-space-change --ignore-whitespace --whitespace=nowarn ../v059.patch
          git apply --ignore-space-change --ignore-whitespace --whitespace=nowarn ../v059.patch

      - name: Verify and apply v0.60 delta
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n' < v060_patch/delta.b64 | base64 --decode > v060.delta.patch.gz
          echo '54138268ddea785a08f21fdc2b9f293001e095ddf48bd10ac5d5f667edde0e2f  v060.delta.patch.gz' | sha256sum -c -
          gzip -dc v060.delta.patch.gz > v060.delta.patch
          echo 'be6f5e9cbbcb627870b185085c999126a3a0e40bd6c2d3b07c1eb619dd0bcbee  v060.delta.patch' | sha256sum -c -
          cd upstream
          git apply --check --directory=guess_4.1 --ignore-space-change --ignore-whitespace --whitespace=nowarn ../v060.delta.patch
          git apply --directory=guess_4.1 --ignore-space-change --ignore-whitespace --whitespace=nowarn ../v060.delta.patch
          test -s guess_4.1/framework/gounsa_lockstep_forcing.cpp
          grep -q 'restart_calendar_year' guess_4.1/framework/lockstep_framework.cpp
          grep -q 'per-cell-forcing' guess_4.1/lockstep_command_line_version/main.cpp

      - name: Build v0.60
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/guess_4.1 -B build-v060 -DUNIT_TESTS=OFF
          cmake --build build-v060 --target guess guess_lockstep --parallel 2
          test -x build-v060/guess && test -x build-v060/guess_lockstep
          sha256sum build-v060/guess build-v060/guess_lockstep | tee v060_build_sha256.txt

      - name: Reconstruct synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n' < v060_ci_fixture/text_fixture.b64 | base64 --decode > fixture.tar.gz
          echo 'f7a4d9ff7378baeb6b7dbe674fc1939cea0fdd919ce6b5b0462e6fe08976def4  fixture.tar.gz' | sha256sum -c -
          mkdir fixture && tar -xzf fixture.tar.gz -C fixture
          test -s fixture/run.ins && test -s fixture/direct_state.csv && test -s fixture/cell_params.csv

      - name: Generate native state and restart with explicit per-cell landid forcing
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++11 -O2 v060_ci_fixture/generate_v060_forcing.cpp -lnetcdf -o generate_v060_forcing
          ./generate_v060_forcing input fixture/forcing.nc
          (cd fixture && ../build-v060/guess -input cf run.ins)
          test -s fixture/state/0.state && test -s fixture/state/meta.bin
          sha256sum fixture/state/0.state fixture/state/meta.bin | tee v060_synthetic_state_sha256.txt
          sed -e 's/^save_state 1/save_state 0/' -e 's/^gounsa_direct_init_enabled 1/gounsa_direct_init_enabled 0/' fixture/run.ins > fixture/lockstep.ins
          ./generate_v060_forcing percell fixture/percell.nc
          (cd fixture && ../build-v060/guess_lockstep -input cf -routing routing.csv -cell-area 900 -cell-parameters cell_params.csv -per-cell-forcing percell.nc -restart-state-path state -restart-state-year 33 -restart-calendar-year 2023 -output cells_out.csv -daily-summary daily.csv -validation validation.json -max-days 3 lockstep.ins)

      - name: Assert scientific-engineering contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json
          from collections import defaultdict
          rows=list(csv.DictReader(open('fixture/cells_out.csv',newline='')))
          assert len(rows)==6
          by=defaultdict(list)
          for r in rows: by[int(r['landid'])].append(r)
          assert set(by)=={42,9001}
          assert {(int(r['row']),int(r['col']),int(r['landid'])) for r in rows}=={(10,20,9001),(10,21,42)}
          for x in by.values(): x.sort(key=lambda r:int(r['day_of_year']))
          assert [float(r['temperature_c']) for r in by[9001]]==[10,11,12]
          assert [float(r['precip_mm']) for r in by[9001]]==[1,3,5]
          assert [float(r['temperature_c']) for r in by[42]]==[20,21,22]
          assert [float(r['precip_mm']) for r in by[42]]==[2,4,6]
          assert all(int(r['calendar_year'])==2023 and int(r['simulation_year'])==33 for r in rows)
          d=list(csv.DictReader(open('fixture/daily.csv',newline='')))
          assert [float(r['mean_precip_mm']) for r in d]==[1.5,3.5,5.5]
          assert all(int(r['routing_outlet_cells'])==1 and abs(float(r['routing_residual_m3']))<1e-12 for r in d)
          v=json.load(open('fixture/validation.json'))
          assert v['mode']=='native_multicell_restart_per_cell_forcing'
          assert v['active_cells']==2 and v['final_routing_outlet_cells']==1 and v['lockstep_days_completed']==3
          assert v['per_cell_forcing_enabled'] and v['explicit_landid_mapping'] and v['native_restart_global_semantics']
          assert (v['restart_state_year'],v['restart_calendar_year'])==(33,2023)
          assert v['per_cell_forcing_wind_unit']=='m s-1 (LPJ climate.u10; BLAZE converts once to km h-1)'
          print('PASS native restart + explicit landid + per-cell forcing + calendar + wind units')
          PY

      - name: Assert missing landid fails fast
        shell: bash
        run: |
          set -euo pipefail
          cp fixture/cell_params.csv fixture/cell_params_bad.csv
          sed -i 's/10,20,9001,/10,20,7777,/' fixture/cell_params_bad.csv
          set +e
          (cd fixture && ../build-v060/guess_lockstep -input cf -routing routing.csv -cell-area 900 -cell-parameters cell_params_bad.csv -per-cell-forcing percell.nc -restart-state-path state -restart-state-year 33 -restart-calendar-year 2023 -output bad_cells.csv -daily-summary bad_daily.csv -validation bad_validation.json -max-days 1 lockstep.ins > bad_landid.log 2>&1)
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'Requested landid 7777 absent from per-cell forcing NetCDF' fixture/bad_landid.log

      - name: Record gate
        shell: bash
        run: |
          cat > V060_CI_GATE.txt <<'EOF2'
          PASS: official LPJ-GUESS 4.1.1 + v0.59 + v0.60 SHA chain
          PASS: Linux guess/guess_lockstep build
          PASS: synthetic native GuessDeserializer multi-cell restart
          PASS: landid != row/col and reversed NetCDF ordering
          PASS: explicit restart calendar state-year 33 -> 2023
          PASS: native global restart semantics
          PASS: wind remains m s-1; BLAZE conversion unchanged
          PASS: missing landid fails fast
          NOT TESTED: real 2021-12-31 state recapture/merge SHA
          NOT TESTED: real 3-cell / 4454-cell restart, DOY147, 365-day, 2025 BLAZE
          BLOCKED: physical sediment-mass/DEM update
          EOF2

      - uses: actions/upload-artifact@v4
        with:
          name: gounsa-v060-native-restart-linux-validation
          path: |
            V060_CI_GATE.txt
            v060_build_sha256.txt
            v060_synthetic_state_sha256.txt
            fixture/cells_out.csv
            fixture/daily.csv
            fixture/validation.json
            fixture/bad_landid.log
          if-no-files-found: error
          retention-days: 14
