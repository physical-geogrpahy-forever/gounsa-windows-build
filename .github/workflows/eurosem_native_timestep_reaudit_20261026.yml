name: EUROSEM 1998 sediment 15 30 60 sec convergence
on:
  push:
    branches: [swehr-water-sediment-closure-20261026]
    paths:
      - ".github/workflows/eurosem_native_timestep_reaudit_20261026.yml"
      - "experiments/rainfall_10_50/run_eurosem_timestep_reaudit_20261026.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timestep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install original GNU Fortran
        run: sudo apt-get update -qq && sudo apt-get install -y gfortran
      - name: Run 12 original and isolated drip factor repaired timestep tests
        run: python3 experiments/rainfall_10_50/run_eurosem_timestep_reaudit_20261026.py
      - name: Save numeric results and native outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurosem-1998-15-30-60-second-convergence
          path: |
            experiments/rainfall_10_50/eurosem_reaudit_20261026/dt_results.csv
            experiments/rainfall_10_50/eurosem_reaudit_20261026/dt_results.json
            experiments/rainfall_10_50/eurosem_QA_*/qa_result.json
            experiments/rainfall_10_50/eurosem_QA_*/static.log
            experiments/rainfall_10_50/eurosem_QA_*/console.log
          retention-days: 21
