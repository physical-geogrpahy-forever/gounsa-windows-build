name: SHETRAN v4.7.5 native sediment example validation
on:
  push:
    branches: [shetran-v475-sediment-audit-20261025]
    paths: [.github/workflows/shetran-v475-sediment-baseline.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-native-sediment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download exact official V4.7.5 binary and upstream sediment benchmark
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/nclwater/Shetran-public/releases/download/V4.7.5/SHETRAN_for_Linux.zip \
            -o SHETRAN_for_Linux_V4.7.5.zip
          sha256sum SHETRAN_for_Linux_V4.7.5.zip | tee official_binary_sha256.txt
          unzip -q SHETRAN_for_Linux_V4.7.5.zip -d release
          find release -maxdepth 6 -type f | head -55
          git clone --depth 1 https://github.com/nclwater/Shetran.git official-source
          git -C official-source rev-parse HEAD | tee official_source_commit.txt
          find official-source/examples/Cobres/model -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Locate the official Linux executable and diagnose shared libraries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          bins=[p for p in Path('release').rglob('*') if p.is_file() and
                (p.name.lower() in ('shetran-linux','shetran','shetran-linux.exe'))]
          assert len(bins)==1,[(str(p),p.stat().st_size) for p in bins]
          p=bins[0].resolve()
          p.chmod(p.stat().st_mode|0o111)
          Path('binary_path.txt').write_text(str(p))
          print('BINARY',p, 'SIZE',p.stat().st_size)
          PY
          BIN="$(cat binary_path.txt)"
          file "$BIN"
          ldd "$BIN" || true
      - name: Execute developer-supplied Cobres sediment and canopy example
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat binary_path.txt)"
          cd official-source/examples/Cobres/model
          timeout 300s "$BIN" -f rundata_cob.txt > ../../../../shetran-native.stdout.log 2>&1
          code=$?
          echo "NATIVE_EXIT=$code"
          tail -90 ../../../../shetran-native.stdout.log
      - name: Verify model outputs from original sediment-enabled run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json,math
          root=Path('official-source/examples/Cobres/model')
          found=[]
          for p in sorted(root.glob('output*')):
              if p.is_file():
                  content=p.read_text(errors='replace')[:100000] if p.suffix.lower() not in ('.h5','.hdf') else ''
                  found.append(dict(name=p.name,bytes=p.stat().st_size,has_nan=bool(re.search(r'\b(?:NaN|Inf)\b',content,re.I))))
          print('OUTPUT_FILES',json.dumps(found,indent=2))
          assert found,'No model outputs'
          pr=root/'output_cob_pri.txt'
          spr=root/'output_cob_spr.txt'
          assert pr.exists() and pr.stat().st_size>200,'No hydrology print output'
          assert spr.exists() and spr.stat().st_size>200,'No sediment print output'
          for p in (pr,spr):
              s=p.read_text(errors='replace')
              print('CHECK',p.name,'head:',s[:1200].replace('\n',' | '))
              print('CHECK',p.name,'tail:',s[-1200:].replace('\n',' | '))
          Path('shetran-output-audit.json').write_text(json.dumps(found,indent=2))
          PY
      - name: Preserve real native output, warnings and exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHETRAN-4.7.5-official-Cobres-sediment-native
          path: |
            official_binary_sha256.txt
            official_source_commit.txt
            binary_path.txt
            shetran-native.stdout.log
            shetran-output-audit.json
            official-source/examples/Cobres/model/output_cob_spr.txt
            official-source/examples/Cobres/model/output_cob_pri.txt
            official-source/examples/Cobres/model/output_cob_mb.csv
            official-source/examples/Cobres/model/output_cob_discharge_hourly.txt
            official-source/examples/Cobres/model/output_cob_discharge_everytimestep.txt
            official-source/examples/Cobres/model/rundata_cob.txt
            official-source/examples/Cobres/model/input_cob_syd.txt
            official-source/examples/Cobres/model/input_cob_etd.txt
          if-no-files-found: warn
          retention-days: 30
