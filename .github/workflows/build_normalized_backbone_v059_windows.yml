name: Build Gounsa v0.59 normalized backbone Windows

on:
  pull_request:
    branches: [main]
    paths:
      - 'v059_patch/**'
      - '.github/workflows/build_normalized_backbone_v059_windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify v0.59 patch
        shell: pwsh
        run: |
          $b64 = ((Get-Content v059_patch\part_00.b64 -Raw).Trim() + (Get-Content v059_patch\part_01.b64 -Raw).Trim())
          [IO.File]::WriteAllBytes('v059_patch\GOUNSA_LPJ411_NORMALIZED_BACKBONE_v0_59.patch.gz',[Convert]::FromBase64String($b64))
          $gzHash=(Get-FileHash 'v059_patch\GOUNSA_LPJ411_NORMALIZED_BACKBONE_v0_59.patch.gz' -Algorithm SHA256).Hash.ToLower()
          if($gzHash -ne '717b0a2c4efbf2e4bbd4997f5f89020750e0a3d90a11125db9e8c480b115cdb5'){throw "gzip patch SHA mismatch: $gzHash"}
          $in=[IO.File]::OpenRead('v059_patch\GOUNSA_LPJ411_NORMALIZED_BACKBONE_v0_59.patch.gz')
          $gz=New-Object IO.Compression.GzipStream($in,[IO.Compression.CompressionMode]::Decompress)
          $out=[IO.File]::Create('v059_patch\GOUNSA_LPJ411_NORMALIZED_BACKBONE_v0_59.patch')
          $gz.CopyTo($out); $out.Dispose(); $gz.Dispose(); $in.Dispose()
          $patchHash=(Get-FileHash 'v059_patch\GOUNSA_LPJ411_NORMALIZED_BACKBONE_v0_59.patch' -Algorithm SHA256).Hash.ToLower()
          if($patchHash -ne 'a4c8a93775b0975db9d3075833f2df83d79844572425e9132ab216dcfc6605b4'){throw "patch SHA mismatch: $patchHash"}

      - name: Download and verify official LPJ-GUESS 4.1.1
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --retry-delay 5 -o guess_4.1.1.zip 'https://zenodo.org/records/8065737/files/guess_4.1.1.zip?download=1'
          if($LASTEXITCODE -ne 0){throw 'Zenodo download failed'}
          $up=(Get-FileHash guess_4.1.1.zip -Algorithm SHA256).Hash.ToLower()
          if($up -ne '9d30881c180bd2d291fea0a5d7e7cf22fc33512bf4c99b452722d4d8d3d8f193'){throw "upstream SHA mismatch: $up"}
          Expand-Archive guess_4.1.1.zip -DestinationPath upstream
          if(!(Test-Path upstream\guess_4.1\CMakeLists.txt)){throw 'LPJ-GUESS source root missing'}

      - name: Apply normalized backbone patch
        shell: pwsh
        run: |
          Push-Location upstream
          git init -q
          git apply --check --ignore-space-change --ignore-whitespace --whitespace=nowarn ..\v059_patch\GOUNSA_LPJ411_NORMALIZED_BACKBONE_v0_59.patch
          if($LASTEXITCODE -ne 0){throw 'normalized patch check failed'}
          git apply --ignore-space-change --ignore-whitespace --whitespace=nowarn ..\v059_patch\GOUNSA_LPJ411_NORMALIZED_BACKBONE_v0_59.patch
          if($LASTEXITCODE -ne 0){throw 'normalized patch apply failed'}
          Pop-Location
          $markers=@(
            'upstream\guess_4.1\framework\lockstep_framework.cpp',
            'upstream\guess_4.1\modules\gounsa_direct_initial_state.cpp',
            'upstream\guess_4.1\modules\veslemexchangeoutput.cpp',
            'upstream\guess_4.1\modules\gounsacohortoutput.cpp'
          )
          foreach($m in $markers){if(!(Test-Path $m)){throw "source marker missing: $m"}}

      - name: Prepare pinned isolated vcpkg
        shell: pwsh
        run: |
          $vcpkg=Join-Path $env:RUNNER_TEMP 'vcpkg-gounsa-v059'
          if(Test-Path $vcpkg){Remove-Item $vcpkg -Recurse -Force}
          git init $vcpkg
          git -C $vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C $vcpkg fetch --depth 1 origin 06d00ffa491e4668627728f14b891d22c6fea146
          if($LASTEXITCODE -ne 0){throw 'pinned vcpkg fetch failed'}
          git -C $vcpkg checkout --detach FETCH_HEAD
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if($LASTEXITCODE -ne 0){throw 'vcpkg bootstrap failed'}
          "VCPKG_GOUNSA=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install NetCDF C
        shell: pwsh
        run: |
          & "$env:VCPKG_GOUNSA\vcpkg.exe" install netcdf-c:x64-windows --disable-metrics
          if($LASTEXITCODE -ne 0){throw 'vcpkg netcdf-c install failed'}

      - name: Configure normalized source
        shell: pwsh
        run: |
          $toolchain="$($env:VCPKG_GOUNSA -replace '\\','/')/scripts/buildsystems/vcpkg.cmake"
          cmake -S upstream\guess_4.1 -B build-v059-win64 -G "Visual Studio 17 2022" -A x64 -DUNIT_TESTS=OFF -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows
          if($LASTEXITCODE -ne 0){throw 'CMake configure failed'}
          $cache=Get-Content build-v059-win64\CMakeCache.txt -Raw
          if($cache -match 'NETCDF_C_LIBRARY:FILEPATH=.*NOTFOUND'){throw 'NetCDF C library not detected'}

      - name: Build guess.exe and guess_lockstep.exe
        shell: pwsh
        run: |
          cmake --build build-v059-win64 --config Release --target guess guess_lockstep -- /m
          if($LASTEXITCODE -ne 0){throw 'normalized Windows build failed'}
          if(!(Test-Path build-v059-win64\Release\guess.exe)){throw 'guess.exe missing'}
          if(!(Test-Path build-v059-win64\Release\guess_lockstep.exe)){throw 'guess_lockstep.exe missing'}

      - name: Assemble Windows validation artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact\bin | Out-Null
          Copy-Item build-v059-win64\Release\guess.exe artifact\bin\guess.exe
          Copy-Item build-v059-win64\Release\guess_lockstep.exe artifact\bin\guess_lockstep.exe
          Copy-Item "$env:VCPKG_GOUNSA\installed\x64-windows\bin\*.dll" artifact\bin\ -Force
          Get-FileHash artifact\bin\guess.exe -Algorithm SHA256 | Format-List | Out-File artifact\windows_binary_sha256.txt -Encoding utf8
          Get-FileHash artifact\bin\guess_lockstep.exe -Algorithm SHA256 | Format-List | Out-File artifact\windows_binary_sha256.txt -Encoding utf8 -Append
          @'
          PASS: Windows source reconstruction/build gate
          NOT TESTED: 4454-cell scientific restart/lockstep trajectory
          NOT TESTED: 2025 native BLAZE rerun
          BLOCKED: physical sediment-mass/DEM update
          '@ | Out-File artifact\V059_WINDOWS_GATE.txt -Encoding utf8

      - name: Upload normalized Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: gounsa-v059-normalized-backbone-windows-x64
          path: artifact
          if-no-files-found: error
          retention-days: 14
