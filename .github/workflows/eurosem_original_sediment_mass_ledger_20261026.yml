name: EUROSEM 1998 original independent sediment mass ledger
on:
  push:
    branches: [swehr-water-sediment-closure-20261026]
    paths:
      - ".github/workflows/eurosem_original_sediment_mass_ledger_20261026.yml"
      - "experiments/rainfall_10_50/run_eurosem_sediment_ledger_20261026.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_native_mass:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        run: sudo apt-get update -qq && sudo apt-get install -y gfortran
      - name: Strict ledger for 24 original Fortran model cases (no simulation substitute)
        run: python3 experiments/rainfall_10_50/run_eurosem_sediment_ledger_20261026.py
      - name: Preserve complete original native flux and mass-source evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eurosem-original-1998-sediment-mass-ledger
          path: |
            experiments/rainfall_10_50/eurosem_reaudit_20261026/sediment_ledger_results.json
            experiments/rainfall_10_50/eurosem_reaudit_20261026/sediment_ledger_results.csv
            experiments/rainfall_10_50/eurosem_QA_*/qa_result.json
            experiments/rainfall_10_50/eurosem_QA_*/console.log
            experiments/rainfall_10_50/eurosem_QA_*/static.log
            experiments/rainfall_10_50/eurosem_QA_*/compile.log
            experiments/rainfall_10_50/eurosem_QA_*/test.par
            experiments/rainfall_10_50/eurosem_QA_*/test.pcp
          retention-days: 21
