name: LORICA-TREED v0.9 landslide process test

on:
  push:
    branches:
      - lorica-treed-v0.9-30yr-coupling-audit
      - lorica-treed-v0.9-mass-audit
    paths:
      - 'lorica_treed/v0.7/**'
      - 'lorica_treed/v0.8/**'
      - 'lorica_treed/v0.9/**'
      - '.github/workflows/lorica-treed-v09-landslide-test.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: lorica-treed-v09-landslide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landslide-process-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Gounsa
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.11.6'

      - name: Cache Julia depot
        uses: julia-actions/cache@v2
        with:
          cache-name: lorica-treed-v09-windows-julia-1.11.6

      - name: Extract exact v0.5 LORICA-TREED source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work | Out-Null
          tar -xf lorica_treed/v0.5/LORICA_TREED_v0.5_source.tar.xz -C work
          if (-not (Test-Path work/LORICA/LORICA_2026.csproj)) { throw 'LORICA project missing' }

      - name: Apply v0.9 rainfall and landslide fixes
        shell: pwsh
        run: |
          python lorica_treed/v0.9/apply_v09_patch.py work
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host '=== v0.9 patched trigger ==='
          Select-String -Path work/LORICA/Functions/geomorph.cs -Pattern 'crrain_m_d\[row, col\] >= 0.0'
          Write-Host '=== v0.9 event rainfall mode ==='
          Select-String -Path work/LORICA/Functions/treed_coupling.cs -Pattern 'explicit_event|treed_landslide_event_intensity_m_d'
          Write-Host '=== v0.9 pre-hydrology rainfall update ==='
          Select-String -Path work/LORICA/LORICA_main.cs -Pattern 'update_time_varying_rainfall_for_current_timestep'
          Write-Host '=== residual-fraction routing sites after patch ==='
          Select-String -Path work/LORICA/Functions/geomorph.cs -Pattern 'undeposited_landslide_fraction' -Context 2,2
          Write-Host '=== landslide mixing radio fields ==='
          Get-ChildItem work/LORICA -Recurse -Filter *.cs | Select-String -Pattern 'ls_mix_radio_' | ForEach-Object { $_.Line.Trim() }

      - name: Prepare deterministic TREED local-grid driver
        shell: pwsh
        run: |
          $treedModule = Join-Path $PWD 'work/TREED/src/TREED.jl'
          $source = [System.IO.File]::ReadAllText($treedModule)
          $source = $source.Replace('using Rasters, ArchGDAL, NCDatasets', 'using Rasters, NCDatasets')
          $source = [System.Text.RegularExpressions.Regex]::Replace($source, '(?m)^using Images\r?\n', '')
          [System.IO.File]::WriteAllText($treedModule, $source, (New-Object System.Text.UTF8Encoding($false)))

          # Keep TREED's original threaded ECA loop. The v0.9 patch gives each
          # grid cell an explicit RNG seed, independent of thread scheduling.
          $modelFunctions = Join-Path $PWD 'work/TREED/src/TREED_model_functions.jl'
          $modelSource = [System.IO.File]::ReadAllText($modelFunctions)
          $threadedLoop = 'Threads.@threads for i = 1:length(lookup(traits_start.H, X))'
          if (-not $modelSource.Contains($threadedLoop)) { throw 'Original TREED ECA threaded loop missing' }
          if (-not $modelSource.Contains('TREED_ECA_BASE_SEED + UInt64((i - 1) * nY + j)')) { throw 'TREED per-cell ECA seed patch missing' }
          $physiology = [System.IO.File]::ReadAllText((Join-Path $PWD 'work/TREED/src/TREED_physiological_functions.jl'))
          if (-not $physiology.Contains('ECA(options=Metaheuristics.Options(seed=seed))')) { throw 'Explicit ECA RNG seed not wired into Optimization.solve' }

          $coupling = Join-Path $PWD 'work/coupling'
          Copy-Item (Join-Path $coupling 'treed_lorica_driver.jl') (Join-Path $coupling 'treed_lorica_driver_core.jl') -Force
          Copy-Item (Join-Path $PWD 'lorica_treed/v0.8/treed_lorica_driver_seeded_wrapper.jl') (Join-Path $coupling 'treed_lorica_driver_seeded_wrapper.jl') -Force

          $cfgSource = Join-Path $coupling 'scenarios/01_original_treed_control.cfg'
          $cfg = [System.IO.File]::ReadAllText($cfgSource)
          $cfg = $cfg.Replace('driver_path=treed_lorica_driver.jl', 'driver_path=treed_lorica_driver_seeded_wrapper.jl')
          if ($cfg -notmatch '(?m)^treed_random_seed=') { $cfg += [Environment]::NewLine + 'treed_random_seed=20261113' + [Environment]::NewLine }
          [System.IO.File]::WriteAllText((Join-Path $coupling 'TREED_coupling.cfg'), $cfg, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host 'TREED_SEEDED_DRIVER_READY'

      - name: Instantiate TREED Julia environment
        shell: pwsh
        working-directory: work/TREED
        run: |
          $env:JULIA_PKG_PRECOMPILE_AUTO='0'
          $env:JULIA_NUM_THREADS='1'
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Load TREED Julia module
        shell: pwsh
        working-directory: work/TREED
        run: |
          $env:JULIA_NUM_THREADS='1'
          julia --project=. -e 'include("src/TREED.jl"); using .TREED; println("TREED_LOAD_OK")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run existing v0.5 Python regression suite
        shell: pwsh
        working-directory: work
        run: |
          $tests = Get-ChildItem tests/test_*.py | Sort-Object Name
          foreach ($test in $tests) {
            Write-Host "=== $($test.Name) ==="
            python $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore LORICA NuGet dependency
        shell: pwsh
        working-directory: work/LORICA
        run: |
          nuget install MathNet.Numerics -Version 4.15.0 -OutputDirectory packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile patched LORICA
        shell: pwsh
        working-directory: work/LORICA
        run: |
          msbuild LORICA_2026.csproj /m /p:Configuration=Release /p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path bin/Release/LORICA.exe)) { throw 'LORICA.exe not produced' }
          Write-Host 'LORICA_V09_BUILD_OK'

      - name: Compile landslide process harness
        shell: pwsh
        working-directory: work/LORICA
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          if (-not (Test-Path $csc)) { throw "csc.exe not found: $csc" }
          & $csc /nologo /target:exe /out:bin/Release/LoricaTreedLandslideSmoke.exe /reference:bin/Release/LORICA.exe /reference:System.dll /reference:System.Core.dll /reference:System.Windows.Forms.dll ..\..\lorica_treed\v0.9\ci\LoricaTreedLandslideSmoke.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path bin/Release/LoricaTreedLandslideSmoke.exe)) { throw 'Landslide harness not produced' }

      - name: Generate uncalibrated baseline TREED root-C raster
        shell: pwsh
        working-directory: work/LORICA/bin/Release
        run: |
          $work = (Resolve-Path ../../../).Path
          $baselineOut = Join-Path $work 'landslide_baseline'
          $env:LORICA_TREED_COUPLING_DIR = Join-Path $work 'coupling'
          $env:JULIA_NUM_THREADS = '1'
          $env:LORICA_TREED_BASELINE_ONLY = '1'
          New-Item -ItemType Directory -Force -Path $baselineOut | Out-Null
          & .\LoricaTreedLandslideSmoke.exe $baselineOut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $baselineOut 'LORICA_TREED_V09_BASELINE_ROOTC_PASS.txt'))) {
            throw 'LORICA v0.9 baseline root-C marker missing'
          }
          $rootC = Join-Path $baselineOut 'treed_same_year_rootcohesion/TREED_exchange_run_9002/0001/output/treed_rootC_areanorm_gC_m2.asc'
          if (-not (Test-Path $rootC)) { throw 'Baseline TREED root-C raster missing' }
          Copy-Item $rootC (Join-Path $work 'baseline_rootC.asc') -Force
          Remove-Item Env:LORICA_TREED_BASELINE_ONLY -ErrorAction SilentlyContinue
          Write-Host 'V09_UNCALIBRATED_BASELINE_ROOTC_READY'

      - name: Calibrate fixed event-scale Tr from the actual TREED baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work/calibration | Out-Null
          python lorica_treed/v0.7/calibrate_event_cohesion.py work/baseline_rootC.asc work/coupling/TREED_coupling.cfg hales2009_wu_mean work/calibration/TREED_coupling_hales2009_wu.cfg work/calibration/hales2009_wu_calibration.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content work/calibration/hales2009_wu_calibration.json
          Copy-Item work/calibration/TREED_coupling_hales2009_wu.cfg work/coupling/TREED_coupling.cfg -Force
          Write-Host 'V09_FIXED_EVENT_SCALE_TR_CALIBRATION_READY'

      - name: Run calibrated root-cohesion and event-landslide process tests
        shell: pwsh
        working-directory: work/LORICA/bin/Release
        run: |
          $work = (Resolve-Path ../../../).Path
          $testOut = Join-Path $work 'landslide_test_calibrated'
          $env:LORICA_TREED_COUPLING_DIR = Join-Path $work 'coupling'
          $env:JULIA_NUM_THREADS = '1'
          Remove-Item Env:LORICA_TREED_BASELINE_ONLY -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $testOut | Out-Null
          & .\LoricaTreedLandslideSmoke.exe $testOut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $testOut 'LORICA_TREED_V09_LANDSLIDE_SMOKE_PASS.txt'))) {
            throw 'LORICA v0.9 calibrated landslide smoke marker missing'
          }
          Get-Content (Join-Path $testOut 'LORICA_TREED_V09_LANDSLIDE_SMOKE_PASS.txt')

      - name: Validate calibrated cohesion, unchanged root biomass, and landslide response
        shell: pwsh
        run: |
          @'
          import csv, json, pathlib

          def read_ascii(path):
              lines = pathlib.Path(path).read_text(encoding="utf-8").strip().splitlines()
              header = lines[:6]
              values = [float(v) for line in lines[6:] for v in line.split()]
              return header, values

          def read_key_values(path):
              out = {}
              for line in pathlib.Path(path).read_text(encoding="utf-8").splitlines():
                  if "=" in line:
                      k, v = line.split("=", 1)
                      out[k.strip()] = v.strip()
              return out

          base = pathlib.Path("work/landslide_baseline/treed_same_year_rootcohesion/TREED_exchange_run_9002/0001/output")
          calibrated = pathlib.Path("work/landslide_test_calibrated/treed_same_year_rootcohesion/TREED_exchange_run_9002/0001/output")
          baseline_header, baseline_rootc = read_ascii(pathlib.Path("work/baseline_rootC.asc"))
          calibrated_header, calibrated_rootc = read_ascii(calibrated / "treed_rootC_areanorm_gC_m2.asc")
          assert baseline_header == calibrated_header, "Root-C raster header changed after event-scale calibration"
          assert len(baseline_rootc) == len(calibrated_rootc), "Root-C raster cell count changed"
          assert all(abs(a-b) < 1e-6 for a,b in zip(baseline_rootc, calibrated_rootc)), "Calibration changed TREED root biomass"

          calibration = json.loads(pathlib.Path("work/calibration/hales2009_wu_calibration.json").read_text(encoding="utf-8"))
          with open(calibrated / "treed_rootcohesion_summary.csv", newline="", encoding="utf-8") as f:
              row = next(csv.DictReader(f))
          target = float(calibration["target_mean_root_cohesion_kPa"])
          tr_eff = float(calibration["effective_event_Tr_MPa"])
          observed = float(row["Cr_corrected_mean_kPa"])
          assert abs(target - 7.6) < 1e-9, target
          assert abs(observed - target) < 0.05, (observed, target)
          assert abs(float(row["Tr_MPa"]) - tr_eff) < 1e-9, (row["Tr_MPa"], tr_eff)
          assert abs(float(row["Cr_raw_mean_kPa"]) - observed) < 1e-8, "Unexpected hidden reduction/multiplier"

          stability = read_key_values(pathlib.Path("work/landslide_test_calibrated/treed_same_year_rootcohesion/TREED_LANDSLIDE_STABILITY_PASS.txt"))
          assert abs(float(stability["TREED_ROOT_MAP_MEAN_KPA"]) - target) < 0.05
          assert int(stability["BARE_INITIATIONS"]) > int(stability["TREED_INITIATIONS"])
          assert float(stability["TREED_MASS_CLOSURE"]) < 1e-6
          assert float(stability["BARE_MASS_CLOSURE"]) < 1e-6

          with open(pathlib.Path("work/landslide_test_calibrated/treed_same_year_rootcohesion/TREED_LANDSLIDE_STABILITY_SENSITIVITY.csv"), newline="", encoding="utf-8") as f:
              scenarios = {r["scenario"]: r for r in csv.DictReader(f)}
          required = {"bare_root", "hales2009_fbm_mean", "hales2009_wu_mean",
                      "korea2025_pinus_densiflora", "korea2025_pinus_koraiensis",
                      "korea2025_quercus_mongolica", "hwang2015_uniform_21p6"}
          assert required.issubset(scenarios), "Missing published root-cohesion sensitivity scenarios"
          assert int(scenarios["bare_root"]["landslide_initiations"]) > 0
          print("V09_CALIBRATED_LANDSLIDE_INTEGRATION_PASS")
          print("baseline_mean_rootC_gC_m2=", sum(baseline_rootc)/len(baseline_rootc))
          print("fixed_event_Tr_eff_MPa=", tr_eff)
          print("calibrated_mean_root_cohesion_kPa=", observed)
          print("TREED_initiations=", stability["TREED_INITIATIONS"])
          print("bare_root_initiations=", stability["BARE_INITIATIONS"])
          '@ | Set-Content -Encoding utf8 work/validate_v09_calibration.py
          python work/validate_v09_calibration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit per-cell ECA reproducibility across thread counts
        shell: pwsh
        working-directory: work/LORICA/bin/Release
        run: |
          $work = (Resolve-Path ../../../).Path
          $modelFunctions = Join-Path $work 'TREED/src/TREED_model_functions.jl'
          $modelSource = [System.IO.File]::ReadAllText($modelFunctions)
          $threadedLoop = 'Threads.@threads for i = 1:length(lookup(traits_start.H, X))'
          if (-not $modelSource.Contains($threadedLoop)) { throw 'Original TREED threaded ECA loop is not present' }
          if (-not $modelSource.Contains('TREED_ECA_BASE_SEED + UInt64((i - 1) * nY + j)')) { throw 'Per-cell ECA seed assignment is missing' }

          $parallelRoot = Join-Path $work 'treed_parallel_reproducibility'
          $env:LORICA_TREED_COUPLING_DIR = Join-Path $work 'coupling'
          $env:LORICA_TREED_BASELINE_ONLY = '1'
          foreach ($threads in @('1', '4')) {
            foreach ($repeat in @(1, 2)) {
              $env:JULIA_NUM_THREADS = $threads
              $runOut = Join-Path $parallelRoot ("threads_" + $threads + "/run_" + $repeat)
              New-Item -ItemType Directory -Force -Path $runOut | Out-Null
              Write-Host ("=== CELL_SEEDED_THREADED_ECA threads=" + $threads + " repeat=" + $repeat + " ===")
              & .\LoricaTreedLandslideSmoke.exe $runOut
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $rootC = Join-Path $runOut 'treed_same_year_rootcohesion/TREED_exchange_run_9002/0001/output/treed_rootC_areanorm_gC_m2.asc'
              if (-not (Test-Path $rootC)) { throw "Threaded TREED root-C output missing: $rootC" }
            }
          }
          Remove-Item Env:LORICA_TREED_BASELINE_ONLY -ErrorAction SilentlyContinue

          @'
          import json, pathlib, sys

          root = pathlib.Path(__file__).resolve().parent / "treed_parallel_reproducibility"
          report = {"source_mode": "original Threads.@threads loop with deterministic per-cell ECA RNG", "thread_counts": {}, "cross_thread_counts": {}}
          failed = False

          def read_ascii(path):
              lines = path.read_text(encoding="utf-8-sig").strip().splitlines()
              return lines[:6], [float(v) for line in lines[6:] for v in line.split()]

          for threads in ("1", "4"):
              a = root / f"threads_{threads}/run_1/treed_same_year_rootcohesion/TREED_exchange_run_9002/0001/output"
              b = root / f"threads_{threads}/run_2/treed_same_year_rootcohesion/TREED_exchange_run_9002/0001/output"
              if not a.is_dir() or not b.is_dir():
                  raise SystemExit(f"Missing threaded TREED output directory for {threads} threads")
              names_a = sorted(p.name for p in a.iterdir() if p.is_file())
              names_b = sorted(p.name for p in b.iterdir() if p.is_file())
              same_names = names_a == names_b
              all_bytes = same_names and all((a / name).read_bytes() == (b / name).read_bytes() for name in names_a)
              raster_names = [name for name in names_a if name.lower().endswith(".asc")]
              same_rasters = same_names and all((a / name).read_bytes() == (b / name).read_bytes() for name in raster_names)
              header_a, values_a = read_ascii(a / "treed_rootC_areanorm_gC_m2.asc")
              header_b, values_b = read_ascii(b / "treed_rootC_areanorm_gC_m2.asc")
              max_abs = max((abs(x-y) for x, y in zip(values_a, values_b)), default=0.0)
              mean_a = sum(values_a) / len(values_a)
              mean_b = sum(values_b) / len(values_b)
              identical = same_rasters and header_a == header_b and len(values_a) == len(values_b) and max_abs == 0.0
              report["thread_counts"][threads] = {
                  "all_output_files_byte_identical": all_bytes,
                  "all_ascii_rasters_identical": same_rasters,
                  "rootC_identical": identical,
                  "rootC_max_abs_difference_gC_m2": max_abs,
                  "run1_mean_rootC_gC_m2": mean_a,
                  "run2_mean_rootC_gC_m2": mean_b,
                  "files_run1": names_a,
                  "files_run2": names_b,
              }
              print(f"THREADS={threads} ASCII_RASTERS_IDENTICAL={same_rasters} ALL_FILES_IDENTICAL={all_bytes} ROOTC_MAX_ABS_DIFF={max_abs:.12g}")
              if not identical:
                  failed = True

          # Thread-count invariance is a separate gate from repeated-run
          # reproducibility within each fixed thread count.
          a = root / "threads_1/run_1/treed_same_year_rootcohesion/TREED_exchange_run_9002/0001/output"
          b = root / "threads_4/run_1/treed_same_year_rootcohesion/TREED_exchange_run_9002/0001/output"
          all_names_a = sorted(p.name for p in a.iterdir() if p.is_file())
          all_names_b = sorted(p.name for p in b.iterdir() if p.is_file())
          same_all_names = all_names_a == all_names_b
          all_files_identical = same_all_names and all((a / name).read_bytes() == (b / name).read_bytes() for name in all_names_a)
          raster_names = [name for name in all_names_a if name.lower().endswith(".asc")]
          same_rasters = same_all_names and all((a / name).read_bytes() == (b / name).read_bytes() for name in raster_names)
          header_a, values_a = read_ascii(a / "treed_rootC_areanorm_gC_m2.asc")
          header_b, values_b = read_ascii(b / "treed_rootC_areanorm_gC_m2.asc")
          cross_max_abs = max((abs(x-y) for x, y in zip(values_a, values_b)), default=0.0)
          cross_identical = all_files_identical and same_rasters and header_a == header_b and len(values_a) == len(values_b) and cross_max_abs == 0.0
          report["cross_thread_counts"] = {
              "all_output_files_byte_identical": all_files_identical,
              "ascii_rasters_identical": same_rasters,
              "rootC_identical": cross_identical,
              "rootC_max_abs_difference_gC_m2": cross_max_abs,
              "threads_1_mean_rootC_gC_m2": sum(values_a) / len(values_a),
              "threads_4_mean_rootC_gC_m2": sum(values_b) / len(values_b),
              "all_files_threads_1": all_names_a,
              "all_files_threads_4": all_names_b,
          }
          print(f"CROSS_THREAD_ALL_FILES_IDENTICAL={all_files_identical} ASCII_RASTERS_IDENTICAL={same_rasters} ROOTC_MAX_ABS_DIFF={cross_max_abs:.12g}")
          if not cross_identical:
              failed = True

          report["all_threaded_repeats_identical"] = not failed
          report["thread_count_invariant"] = cross_identical
          out = root / "threaded_reproducibility_report.json"
          out.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print("THREADED_REPRODUCIBILITY_REPORT=" + str(out))
          if failed:
              raise SystemExit("Cell-seeded TREED ECA failed repeat or cross-thread reproducibility")
          print("CELL_SEEDED_THREADED_ECA_REPRODUCIBILITY_PASS")
          '@ | Set-Content -Encoding utf8 (Join-Path $work 'compare_treed_reproducibility.py')
          python (Join-Path $work 'compare_treed_reproducibility.py')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload process-level landslide outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lorica-treed-v09-landslide-process-${{ github.run_number }}
          path: |
            work/baseline_rootC.asc
            work/calibration/**
            work/landslide_baseline/**
            work/landslide_test_calibrated/**
            work/LORICA/Functions/geomorph.cs
            work/LORICA/Functions/treed_coupling.cs
            work/LORICA/Functions/initialise_update.cs
            work/LORICA/Functions/soil.cs
            work/LORICA/Functions/hydro.cs
            work/LORICA/LORICA_main.cs
            work/LORICA/**/*.cs
            work/TREED/src/TREED_model_functions.jl
            work/TREED/Project.toml
            work/TREED/Manifest.toml
            work/TREED/src/TREED_physiological_functions.jl
            work/coupling/treed_lorica_driver_seeded_wrapper.jl
            work/compare_treed_reproducibility.py
            work/treed_parallel_reproducibility/**
            work/coupling/**
          if-no-files-found: warn
