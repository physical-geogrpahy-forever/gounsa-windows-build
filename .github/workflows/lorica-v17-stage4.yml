name: LORICA TREED v1.7 stage 4, root reinforcement at the slip plane

# Stage 4: the existing conversion (Hwang et al. 2015) gives a column-mean root cohesion, scaled by
# the 3.4/7.6 factor (0.447), and LORICA uses it as the cohesion at the failure plane. This stage adds
# root_reinforcement_mode=basal_profile: Wu and Waldron form c_r = k'' k' Tr (Br/rho_r) f(z_slip) with the
# Jackson (1996) root profile set by the cell's rooting depth z_r, k'' given explicitly. Same seeded
# SYNTHETIC seasonal weather and A/B landslide design as lorica-v17-seasonal.yml; not field data.
# 1) unit job (stage 2 and 3 Julia tests, stage 4 profile maths); 2) mode hwang_mean must reproduce the
# v1.7 seasonal rd c14 runs byte for byte; 3) basal_profile runs and an independent recomputation of the
# cohesion from the published rasters. Initiation counts are a result here, so the driver's 1..6 window is
# widened to 0..25.

on:
  push:
    branches:
      - lorica-treed-v1.7-root-depth
    paths:
      - '.github/workflows/lorica-v17-stage4.yml'

permissions:
  contents: read

env:
  RUN_STAMP: 's4-3'
  LR_WEATHER: 'seasonal_stochastic'
  LR_WEATHER_SEED: '20261113'
  # Design fixed by native probes #43789221109 and #43790023979: hollow scarp
  # (outer/inner/centre column 36/42/46 deg between rows 1 and 2) gives exactly
  # 3 native initiations at 0.9-1.1x the v1.5 year-4 root cohesion and 0 at a
  # 0.1 mm/6 h trigger. Daily rainfall = v1.5 forcing in every year.
  LR_DEM_FAMILY: 'hollow_row1to2:36:42:46'
  LR_SCARP_DEG: '0'
  LR_LATERAL_M: '2'
  LR_DAILY_STORM_MM: '60'
  LR_PRE_EVENT_TRIGGER_MM: '0.1'
  LR_EVENT_TRIGGER_MM: '60'
  LR_POST_EVENT_TRIGGER_MM: '60'
  LR_EVENT_YEAR: '4'
  LR_YEARS: '34'
  LR_BETA: '2'
  LR_K: '0.0001'
  LR_MIN_INIT: '0'
  LR_MAX_INIT: '25'

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11.6'
      - uses: julia-actions/cache@v2
        with:
          cache-name: lorica-treed-v12-fpc-ab-julia-1.11.6

      - name: Extract exact v0.5 source, v1.1-v1.3 patches, v1.6 hook, v1.7 root-depth, stage-2, stage-3 and stage-4 modules (all default off)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work, report/logs | Out-Null
          tar -xf lorica_treed/v0.5/LORICA_TREED_v0.5_source.tar.xz -C work
          foreach ($p in @('lorica_treed/v1.1/apply_v11_formula_patch.py','lorica_treed/v1.2/instrument_water_export.py','lorica_treed/v1.3/fix_downstream_sediment_accumulation.py','lorica_treed/v1.6/instrument_landslide_snapshots.py','lorica_treed/v1.7/apply_root_depth_trait_module.py','lorica_treed/v1.7/apply_stage2_mortality_dispersal.py','lorica_treed/v1.7/apply_stage3_paw_profile.py','lorica_treed/v1.7/apply_stage4_basal_root_reinforcement.py')) {
            python $p work 2>&1 | Tee-Object -Append -FilePath report/logs/patch.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Prepare deterministic TREED driver (identical to v1.5)
        shell: pwsh
        run: |
          $treedModule = Join-Path $PWD 'work/TREED/src/TREED.jl'
          $source = [System.IO.File]::ReadAllText($treedModule)
          $source = $source.Replace('using Rasters, ArchGDAL, NCDatasets', 'using Rasters, NCDatasets')
          $source = [System.Text.RegularExpressions.Regex]::Replace($source, '(?m)^using Images\r?\n', '')
          [System.IO.File]::WriteAllText($treedModule, $source, (New-Object System.Text.UTF8Encoding($false)))
          $modelFunctions = Join-Path $PWD 'work/TREED/src/TREED_model_functions.jl'
          $modelSource = [System.IO.File]::ReadAllText($modelFunctions)
          $parallelLoop = 'Threads.@threads for i = 1:length(lookup(traits_start.H, X))'
          if (-not $modelSource.Contains($parallelLoop)) { throw 'TREED ECA optimization loop anchor missing' }
          $modelSource = $modelSource.Replace($parallelLoop, 'for i = 1:length(lookup(traits_start.H, X))')
          [System.IO.File]::WriteAllText($modelFunctions, $modelSource, (New-Object System.Text.UTF8Encoding($false)))
          $coupling = Join-Path $PWD 'work/coupling'
          Copy-Item (Join-Path $coupling 'treed_lorica_driver.jl') (Join-Path $coupling 'treed_lorica_driver_core.jl') -Force
          Copy-Item (Join-Path $PWD 'lorica_treed/v1.0/treed_lorica_driver_seeded_wrapper.jl') (Join-Path $coupling 'treed_lorica_driver_seeded_wrapper.jl') -Force
          $cfg = [System.IO.File]::ReadAllText((Join-Path $coupling 'scenarios/01_original_treed_control.cfg'))
          $cfg = $cfg.Replace('driver_path=treed_lorica_driver.jl', 'driver_path=treed_lorica_driver_seeded_wrapper.jl')
          if ($cfg -notmatch '(?m)^treed_random_seed=') { $cfg += [Environment]::NewLine + 'treed_random_seed=20261113' + [Environment]::NewLine }
          [System.IO.File]::WriteAllText((Join-Path $coupling 'TREED_coupling.cfg'), $cfg, (New-Object System.Text.UTF8Encoding($false)))

      - name: Instantiate and load actual TREED Julia model
        shell: pwsh
        working-directory: work/TREED
        run: |
          $env:JULIA_PKG_PRECOMPILE_AUTO='0'
          $env:JULIA_NUM_THREADS='1'
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          julia --project=. -e 'include("src/TREED.jl"); using .TREED; println("TREED_LOAD_OK")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage-2 and stage-3 unit tests
        shell: pwsh
        run: |
          $env:JULIA_PKG_PRECOMPILE_AUTO='0'
          $env:JULIA_NUM_THREADS='1'
          New-Item -ItemType Directory -Force -Path report/logs | Out-Null
          julia --project=work/TREED lorica_treed/v1.7/tests/stage2_unit_test.jl work/TREED 2>&1 | Tee-Object -FilePath report/logs/unit2.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path report/logs/unit2.log -Pattern 'STAGE2_UNIT_TESTS_DONE' -Quiet)) { throw 'stage-2 unit test did not finish' }
          julia --project=work/TREED lorica_treed/v1.7/tests/stage3_unit_test.jl work/TREED 2>&1 | Tee-Object -FilePath report/logs/unit3.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path report/logs/unit3.log -Pattern 'STAGE3_UNIT_TESTS_DONE' -Quiet)) { throw 'stage-3 unit test did not finish' }
          python -m pip install --quiet numpy
          python -I lorica_treed/v1.7/tests/check_basal_cohesion.py 2>&1 | Tee-Object -FilePath report/logs/unit4.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lorica-v17s4-unit
          path: report/**
          if-no-files-found: ignore

  native-coupled:
    needs: unit
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: A_hm_c14,       condition: A_no_landslide,       rd: 'milly_stochastic', cost: '14.0', mode: 'hwang_mean',    kdp: '0',                   trunc: 'module'}
          - {name: B_hm_c14,       condition: B_landslide_original, rd: 'milly_stochastic', cost: '14.0', mode: 'hwang_mean',    kdp: '0',                   trunc: 'module'}
          - {name: A_bp447_mod,    condition: A_no_landslide,       rd: 'milly_stochastic', cost: '14.0', mode: 'basal_profile', kdp: '0.4473684210526316', trunc: 'module'}
          - {name: B_bp447_mod,    condition: B_landslide_original, rd: 'milly_stochastic', cost: '14.0', mode: 'basal_profile', kdp: '0.4473684210526316', trunc: 'module'}
          - {name: B_bp447_sb,     condition: B_landslide_original, rd: 'milly_stochastic', cost: '14.0', mode: 'basal_profile', kdp: '0.4473684210526316', trunc: 'soil_bottom'}
          - {name: B_bp100_mod,    condition: B_landslide_original, rd: 'milly_stochastic', cost: '14.0', mode: 'basal_profile', kdp: '1.0',                trunc: 'module'}
          - {name: B_bp033_mod,    condition: B_landslide_original, rd: 'milly_stochastic', cost: '14.0', mode: 'basal_profile', kdp: '0.3333333333333333', trunc: 'module'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11.6'
      - uses: julia-actions/cache@v2
        with:
          cache-name: lorica-treed-v12-fpc-ab-julia-1.11.6

      - name: Extract exact v0.5 source, v1.1-v1.3 patches, v1.6 hook, v1.7 root-depth, stage-2, stage-3 and stage-4 modules (all default off)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work, report/logs | Out-Null
          tar -xf lorica_treed/v0.5/LORICA_TREED_v0.5_source.tar.xz -C work
          foreach ($p in @('lorica_treed/v1.1/apply_v11_formula_patch.py','lorica_treed/v1.2/instrument_water_export.py','lorica_treed/v1.3/fix_downstream_sediment_accumulation.py','lorica_treed/v1.6/instrument_landslide_snapshots.py','lorica_treed/v1.7/apply_root_depth_trait_module.py','lorica_treed/v1.7/apply_stage2_mortality_dispersal.py','lorica_treed/v1.7/apply_stage3_paw_profile.py','lorica_treed/v1.7/apply_stage4_basal_root_reinforcement.py')) {
            python $p work 2>&1 | Tee-Object -Append -FilePath report/logs/patch.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Prepare deterministic TREED driver (identical to v1.5)
        shell: pwsh
        run: |
          $treedModule = Join-Path $PWD 'work/TREED/src/TREED.jl'
          $source = [System.IO.File]::ReadAllText($treedModule)
          $source = $source.Replace('using Rasters, ArchGDAL, NCDatasets', 'using Rasters, NCDatasets')
          $source = [System.Text.RegularExpressions.Regex]::Replace($source, '(?m)^using Images\r?\n', '')
          [System.IO.File]::WriteAllText($treedModule, $source, (New-Object System.Text.UTF8Encoding($false)))
          $modelFunctions = Join-Path $PWD 'work/TREED/src/TREED_model_functions.jl'
          $modelSource = [System.IO.File]::ReadAllText($modelFunctions)
          $parallelLoop = 'Threads.@threads for i = 1:length(lookup(traits_start.H, X))'
          if (-not $modelSource.Contains($parallelLoop)) { throw 'TREED ECA optimization loop anchor missing' }
          $modelSource = $modelSource.Replace($parallelLoop, 'for i = 1:length(lookup(traits_start.H, X))')
          [System.IO.File]::WriteAllText($modelFunctions, $modelSource, (New-Object System.Text.UTF8Encoding($false)))
          $coupling = Join-Path $PWD 'work/coupling'
          Copy-Item (Join-Path $coupling 'treed_lorica_driver.jl') (Join-Path $coupling 'treed_lorica_driver_core.jl') -Force
          Copy-Item (Join-Path $PWD 'lorica_treed/v1.0/treed_lorica_driver_seeded_wrapper.jl') (Join-Path $coupling 'treed_lorica_driver_seeded_wrapper.jl') -Force
          $cfg = [System.IO.File]::ReadAllText((Join-Path $coupling 'scenarios/01_original_treed_control.cfg'))
          $cfg = $cfg.Replace('driver_path=treed_lorica_driver.jl', 'driver_path=treed_lorica_driver_seeded_wrapper.jl')
          if ($cfg -notmatch '(?m)^treed_random_seed=') { $cfg += [Environment]::NewLine + 'treed_random_seed=20261113' + [Environment]::NewLine }
          [System.IO.File]::WriteAllText((Join-Path $coupling 'TREED_coupling.cfg'), $cfg, (New-Object System.Text.UTF8Encoding($false)))

      - name: Instantiate and load actual TREED Julia model
        shell: pwsh
        working-directory: work/TREED
        run: |
          $env:JULIA_PKG_PRECOMPILE_AUTO='0'
          $env:JULIA_NUM_THREADS='1'
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          julia --project=. -e 'include("src/TREED.jl"); using .TREED; println("TREED_LOAD_OK")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2

      - name: Compile LORICA and v1.7 runner
        shell: pwsh
        working-directory: work/LORICA
        run: |
          nuget install MathNet.Numerics -Version 4.15.0 -OutputDirectory packages -NonInteractive | Out-Null
          msbuild LORICA_2026.csproj /m /p:Configuration=Release /p:Platform=AnyCPU /v:minimal 2>&1 | Tee-Object -FilePath ../../report/logs/msbuild.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $csc /nologo /target:exe /out:bin/Release/LoricaTreedLandslideRecovery.exe /reference:bin/Release/LORICA.exe /reference:System.dll /reference:System.Core.dll /reference:System.Windows.Forms.dll ..\..\lorica_treed\v1.7\ci\LoricaTreedLandslideRecovery.cs 2>&1 | Tee-Object -FilePath ../../report/logs/csc.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: TREED root-carbon baseline (same as v1.5)
        shell: pwsh
        working-directory: work/LORICA/bin/Release
        run: |
          $work = (Resolve-Path ../../../).Path
          $env:LORICA_TREED_COUPLING_DIR = Join-Path $work 'coupling'
          $env:JULIA_NUM_THREADS='1'
          $env:LORICA_TREED_BASELINE_ONLY='1'
          $baseline = Join-Path $work 'landslide_baseline'
          New-Item -ItemType Directory -Force -Path $baseline | Out-Null
          & .\LoricaTreedLandslideRecovery.exe $baseline 2>&1 | Tee-Object -FilePath ../../../../report/logs/baseline.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rootC = Join-Path $baseline 'treed_same_year_rootcohesion/TREED_exchange_run_9002/0001/output/treed_rootC_areanorm_gC_m2.asc'
          if (-not (Test-Path $rootC)) { throw 'Baseline TREED rootC missing' }
          Copy-Item $rootC (Join-Path $work 'baseline_rootC.asc') -Force

      - name: Calibrate identical fixed Hales event-scale root cohesion and enable soil-water coupling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work/calibration | Out-Null
          python lorica_treed/v0.7/calibrate_event_cohesion.py work/baseline_rootC.asc work/coupling/TREED_coupling.cfg hales2009_wu_mean work/calibration/TREED_coupling_hales2009_wu.cfg work/calibration/hales2009_wu_calibration.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item work/calibration/TREED_coupling_hales2009_wu.cfg work/coupling/TREED_coupling.cfg -Force
          $p='work/coupling/TREED_coupling.cfg'
          $cfg=[System.IO.File]::ReadAllText((Resolve-Path $p).Path)
          if ($cfg -notmatch '(?m)^soil_water_coupling_strength=') { throw 'Missing soil-water coupling setting' }
          $cfg=[regex]::Replace($cfg,'(?m)^soil_water_coupling_strength=.*$', 'soil_water_coupling_strength=1.0')
          # Root-depth keys are added only now, so the Hales event-scale cohesion is calibrated on the
          # root-depth-off baseline for every condition (A_rd and B_rd differ from A_off only by the module).
          if ('${{ matrix.mode }}' -eq 'basal_profile') { $cfg += [Environment]::NewLine + 'root_reinforcement_mode=basal_profile' + [Environment]::NewLine + 'root_k_double_prime=${{ matrix.kdp }}' + [Environment]::NewLine + 'root_profile_truncation=${{ matrix.trunc }}' + [Environment]::NewLine }
          if ('${{ matrix.rd }}' -ne 'off') { $cfg += [Environment]::NewLine + 'root_depth_mode=${{ matrix.rd }}' + [Environment]::NewLine + "root_depth_cost_gC_m2_yr_per_m=${{ matrix.cost }}" + [Environment]::NewLine }
          [System.IO.File]::WriteAllText((Resolve-Path $p).Path,$cfg,(New-Object System.Text.UTF8Encoding($false)))
          # Seasonal radiation/cloud climatology (SYNTHETIC placeholder), written after the calibration baseline.
          $rad = @('month,clt_fraction,rsds_W_m2','1,0.45,95','2,0.45,125','3,0.50,160','4,0.50,200','5,0.55,220','6,0.65,210','7,0.80,180','8,0.70,185','9,0.50,160','10,0.40,135','11,0.45,100','12,0.45,85')
          Set-Content -Path work/coupling/TREED_radiation_monthly.csv -Value $rad -Encoding ascii

      - name: Run native annual coupled model
        shell: pwsh
        working-directory: work/LORICA/bin/Release
        run: |
          $work = (Resolve-Path ../../../).Path
          $env:LORICA_TREED_COUPLING_DIR = Join-Path $work 'coupling'
          $env:JULIA_NUM_THREADS='1'
          Remove-Item Env:LORICA_TREED_BASELINE_ONLY -ErrorAction SilentlyContinue
          $env:GOUNSA_LR_MODE = 'experiment'
          if ($false) {
          } else {
            $env:GOUNSA_LR_CONDITION='${{ matrix.condition }}'
            $env:GOUNSA_LR_WEATHER=$env:LR_WEATHER; $env:GOUNSA_LR_WEATHER_SEED=$env:LR_WEATHER_SEED
            $env:GOUNSA_LR_YEARS=$env:LR_YEARS; $env:GOUNSA_LR_EVENT_YEAR=$env:LR_EVENT_YEAR
            $env:GOUNSA_LR_DAILY_STORM_MM=$env:LR_DAILY_STORM_MM; $env:GOUNSA_LR_PRE_EVENT_TRIGGER_MM=$env:LR_PRE_EVENT_TRIGGER_MM
            $env:GOUNSA_LR_EVENT_TRIGGER_MM=$env:LR_EVENT_TRIGGER_MM; $env:GOUNSA_LR_POST_EVENT_TRIGGER_MM=$env:LR_POST_EVENT_TRIGGER_MM
            $env:GOUNSA_LR_DEM_FAMILY=$env:LR_DEM_FAMILY; $env:GOUNSA_LR_SCARP_DEG=$env:LR_SCARP_DEG
            $env:GOUNSA_LR_LATERAL_M=$env:LR_LATERAL_M; $env:GOUNSA_LR_BETA=$env:LR_BETA; $env:GOUNSA_LR_K=$env:LR_K
            $env:GOUNSA_LR_MIN_INITIATIONS=$env:LR_MIN_INIT; $env:GOUNSA_LR_MAX_INITIATIONS=$env:LR_MAX_INIT
          }
          $out = Join-Path $work 'lr_out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & .\LoricaTreedLandslideRecovery.exe $out 2>&1 | Tee-Object -FilePath ../../../../report/logs/run.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Dump TREED restart traits and NetCDF outputs (read-only)
        if: always()
        shell: pwsh
        run: |
          $run = 'work/lr_out/landslide_recovery'
          if (Test-Path $run) {
            $env:JULIA_NUM_THREADS='1'
            julia --project=work/TREED lorica_treed/v1.6/dump_treed_states.jl $run work/TREED 2>&1 | Tee-Object -FilePath report/logs/dump.log
          }

      - name: Stage outputs
        if: always()
        shell: pwsh
        run: |
          $run = 'work/lr_out/landslide_recovery'
          New-Item -ItemType Directory -Force -Path report/run | Out-Null
          if (Test-Path $run) {
            Get-ChildItem $run | Where-Object { $_.Name -notlike 'TREED_exchange_run_*' } | ForEach-Object { Copy-Item $_.FullName -Destination report/run -Recurse -Force }
            $ex = Get-ChildItem $run -Directory -Filter 'TREED_exchange_run_*' | Select-Object -First 1
            if ($ex) { Compress-Archive -Path $ex.FullName -DestinationPath report/TREED_exchange.zip -Force }
          }
          if (Test-Path work/calibration/hales2009_wu_calibration.json) { Copy-Item work/calibration/hales2009_wu_calibration.json report/ }
          Copy-Item work/coupling/TREED_coupling.cfg report/TREED_coupling_template.cfg -Force
          @("condition=${{ matrix.name }}","root_depth_mode=${{ matrix.rd }}","root_depth_cost=${{ matrix.cost }}","root_reinforcement_mode=${{ matrix.mode }} k_double_prime=${{ matrix.kdp }} truncation=${{ matrix.trunc }}","weather=$env:LR_WEATHER seed=$env:LR_WEATHER_SEED","sha=$env:GITHUB_SHA","dem=$env:LR_DEM_FAMILY","scarp_deg=$env:LR_SCARP_DEG","lateral_m=$env:LR_LATERAL_M","triggers_mm_6h=$env:LR_PRE_EVENT_TRIGGER_MM/$env:LR_EVENT_TRIGGER_MM/$env:LR_POST_EVENT_TRIGGER_MM","event_year=$env:LR_EVENT_YEAR","years=$env:LR_YEARS","beta=$env:LR_BETA","K=$env:LR_K") | Set-Content -Encoding utf8 report/scenario.txt

      - name: Surface failing log tail as annotation
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem report/logs -Filter *.log) {
            $tail = (Get-Content $f.FullName -Tail 25) -join '%0A'
            Write-Output "::error title=$($f.Name)::$tail"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lorica-v17s4-${{ matrix.name }}
          path: report/**
          if-no-files-found: error

  verify-and-publish:
    needs: native-coupled
    if: always() && needs.native-coupled.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: lorica-v17s4-*
          path: collected
      - name: Regression (hwang_mean versus the v1.7 seasonal runs) and basal cohesion recomputation
        run: |
          git fetch -q --depth 1 origin +refs/heads/lorica-treed-v1.6-landslide-recovery-results:refs/remotes/origin/res
          mkdir -p old collected
          for c in A_rd_c14 B_rd_c14; do
            git show origin/res:runs/43819039305_v17seasonal/lorica-v17s-$c/TREED_exchange.zip > old/$c.zip
          done
          python -m pip install --quiet numpy
          rc=0
          python lorica_treed/v1.7/tests/compare_regression.py collected/lorica-v17s4-A_hm_c14/TREED_exchange.zip old/A_rd_c14.zip A_hm_c14 > collected/regression.txt 2>&1 || rc=1
          python lorica_treed/v1.7/tests/compare_regression.py collected/lorica-v17s4-B_hm_c14/TREED_exchange.zip old/B_rd_c14.zip B_hm_c14 >> collected/regression.txt 2>&1 || rc=1
          for c in A_bp447_mod B_bp447_mod B_bp447_sb B_bp100_mod B_bp033_mod; do
            python lorica_treed/v1.7/tests/check_basal_cohesion.py collected/lorica-v17s4-$c/TREED_exchange.zip $c >> collected/regression.txt 2>&1 || rc=1
          done
          echo "checks_exit=$rc" >> collected/regression.txt
          cat collected/regression.txt
          if [ "$rc" -ne 0 ]; then echo 'regression or basal-cohesion check failed'; exit 1; fi
      - name: Commit outputs to results branch
        if: always()
        env:
