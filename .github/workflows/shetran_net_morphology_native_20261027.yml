name: SHETRAN original 0.282ha cellwise net terrain erosion deposition audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shetran_net_morphology_native_20261027.yml'
      - 'experiments/shetran_net_surface_change_20261027.py'
      - 'experiments/shetran_morphology_diag_instrument_20261027.py'
      - 'experiments/shetran_plot_native_net_change_20261027.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-morphological-net-change:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nclwater/Shetran
          ref: cf9cd540add78ad3accbaf62b4199d2032887f6b
          path: original
      - uses: actions/checkout@v4
        with:
          path: audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check fypp numpy h5py matplotlib
      - name: Original model + independent geomorphic-only diagnostic logging
        run: |
          python audit/experiments/shetran_instrument_sediment_qa_20261027.py original/src/sediment/SYmod.f90
          python audit/experiments/shetran_spatial_flux_instrument_20261027.py original/src/sediment/SYmod.f90
          python audit/experiments/shetran_morphology_diag_instrument_20261027.py original/src/sediment/SYmod.f90
      - name: Build original Fortran algorithms with diagnostic WRITE only
        working-directory: original
        run: |
          export FFLAGS="-ffree-line-length-none"
          ./build.sh -c gfortran -t Debug -j 2
          test -x build/debug/bin/shetran
      - name: Native 4m mixed oak Miscanthus per-cell erosion and sediment net topographic change
        run: |
          python audit/experiments/shetran_net_surface_change_20261027.py \
            --original-model original/examples/Cobres/model \
            --exe original/build/debug/bin/shetran \
            --out /tmp/gounsa_shetran_morph
      - name: Make synthetic cellwise net elevation and ON OFF difference PNG and CSV
        run: |
          python audit/experiments/shetran_plot_native_net_change_20261027.py \
            --out /tmp/gounsa_shetran_morph
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shetran-native-event-end-net-elevation
          path: |
            /tmp/gounsa_shetran_morph/*.png
            /tmp/gounsa_shetran_morph/synthetic_native_cellwise_erosion_deposition.csv
            /tmp/gounsa_shetran_morph/on_minus_off_elevation_change.json
            /tmp/gounsa_shetran_morph/*/net_elevation_summary.json
            /tmp/gounsa_shetran_morph/*/net_elevation_cells.json
            /tmp/gounsa_shetran_morph/*/qa_morph_stdout.txt
          retention-days: 30
          if-no-files-found: warn
