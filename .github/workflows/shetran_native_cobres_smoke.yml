name: SHETRAN 4.7.2 pinned native Cobres sediment smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shetran_native_cobres_smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cobres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned original SHETRAN, unchanged
        uses: actions/checkout@v4
        with:
          repository: nclwater/Shetran
          ref: cf9cd540add78ad3accbaf62b4199d2032887f6b
          path: original
      - name: Checkout Gounsa analysis scripts
        uses: actions/checkout@v4
        with:
          path: audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install --disable-pip-version-check fypp h5py numpy
          gfortran --version | head -1
          gcc --version | head -1
          cmake --version | head -1
          find original/external/tarballs -type f -printf '%f %s bytes\n'
      - name: Build entire original SHETRAN executable with GNU Fortran
        working-directory: original
        run: |
          # Original ZQmod.f90 has a >132-column free-form line. This is a compiler flag,
          # not a modification to SHETRAN source or hydrological algorithms.
          export FFLAGS="-ffree-line-length-none"
          ./build.sh -c gfortran -t Debug -j 2
          test -x build/debug/bin/shetran
          file build/debug/bin/shetran
      - name: Run native Cobres 48h sediment event (input copy only)
        run: |
          set -euo pipefail
          mkdir -p /tmp/shetran-native-cobres
          cp -a original/examples/Cobres/model/. /tmp/shetran-native-cobres/
          python - <<'PY'
          from pathlib import Path
          f=Path('/tmp/shetran-native-cobres/input_cob_frd.txt')
          lines=f.read_text().splitlines(keepends=True)
          changes={'':None,
             ':FR6   END TIME OF SIMULATION': '1977 10 3 0 0',
             ':FR7a  START TIME OF SEDIMENT SIMULATION': '1977 10 1 0 0'}
          seen=set()
          for i,line in enumerate(lines[:-1]):
              s=line.strip()
              if s.startswith(':FR6') or s.startswith(':FR7a'):
                  key=':FR6   END TIME OF SIMULATION' if s.startswith(':FR6') else ':FR7a  START TIME OF SEDIMENT SIMULATION'
                  fields=list(map(int,lines[i+1].split()))
                  assert len(fields)==5 and fields[0]==1977, (s,fields)
                  lines[i+1]=''.join(f'{v:7d}' for v in map(int,changes[key].split()))+'\n'
                  seen.add(key)
          assert len(seen)==2, seen
          f.write_text(''.join(lines))
          print('ORIGINAL_SOURCE_UNCHANGED; input-copy-only shortened to 48 h with sediment active at t=0')
          PY
          EXE="$(pwd)/original/build/debug/bin/shetran"
          ( cd /tmp/shetran-native-cobres && timeout 480s "$EXE" -f rundata_cob.txt ) > /tmp/shetran-native-cobres/native_stdout.log 2>&1 || {
            tail -n 100 /tmp/shetran-native-cobres/native_stdout.log
            exit 1
          }
          tail -n 40 /tmp/shetran-native-cobres/native_stdout.log
      - name: Native SHETRAN fixed 3-hour rainfall events at 10 30 and 50 mm/h
        run: |
          set -euo pipefail
          EXE="$(pwd)/original/build/debug/bin/shetran"
          for MMH in 10 20 30 40 50; do
            DIR="/tmp/shetran-native-cobres-rain${MMH}"
            mkdir -p "$DIR"
            cp -a original/examples/Cobres/model/. "$DIR/"
            python - "$DIR" "$MMH" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1]);rain=float(sys.argv[2])
          frd=root/"input_cob_frd.txt"
          lines=frd.read_text().splitlines(keepends=True)
          seen=set()
          for i,line in enumerate(lines[:-1]):
              if line.strip().startswith(":FR6"):
                  lines[i+1]="".join(f"{v:7d}" for v in [1977,10,3,0,0])+"\n"
                  seen.add("END")
              elif line.strip().startswith(":FR7a"):
                  lines[i+1]="".join(f"{v:7d}" for v in [1977,10,1,0,0])+"\n"
                  seen.add("SED_START")
          assert seen=={"END","SED_START"},seen
          frd.write_text("".join(lines))
          prd=root/"input_wet_prd.txt"
          q=prd.read_text().splitlines(keepends=True)
          assert len(q)>50 and "rainfall" in q[0].lower()
          for i in range(1,49):
              fields=q[i].split()
              assert len(fields)==5, (i,fields)
              q[i]="".join(f"{(rain if i<=3 else 0):10.4f}" for _ in range(5))+"\n"
          prd.write_text("".join(q))
          print(f"INPUT_COPY_ONLY_STORM_{rain:.0f}mmh_3h_then_dry")
          PY
            (cd "$DIR" && timeout 480s "$EXE" -f rundata_cob.txt) > "$DIR/native_stdout.log" 2>&1 || {
              echo "FAILED_STORM=$MMH"; tail -n 100 "$DIR/native_stdout.log"; exit 1;
            }
            test -s "$DIR/output_cob_shegraph.h5"
            echo "NATIVE_STORM_${MMH}MMH_SUCCESS"
          done
      - name: Inspect native result files and HDF5 sediment fields
        run: |
          python - <<'PY'
          from pathlib import Path
          import h5py
          root=Path('/tmp/shetran-native-cobres')
          outputs=sorted(root.glob('output_*'))
          assert outputs, 'Native SHETRAN produced no output files'
          print('NATIVE_OUTPUTS:', [(f.name,f.stat().st_size) for f in outputs])
          h5s=sorted(root.glob('*.h5'))
          assert h5s, 'No native shegraph HDF5 output'
          for path in h5s:
              with h5py.File(path) as f:
                  datasets=[]
                  def inspect(name,obj):
                      if isinstance(obj,h5py.Dataset):
                          datasets.append((name,tuple(obj.shape),str(obj.dtype)))
                  f.visititems(inspect)
                  print('HDF5_DATASETS:',datasets[:100])
                  assert len(datasets)>0
          print('NATIVE_COBRES_48H_EXIT0_AND_HDF5_PRESENT')
          print('WARNING: EXTERNAL EVENT RESTART AND FULL SEDIMENT MASS CONSERVATION NOT TESTED')
          PY
      - name: Quantify original native sediment HDF5 and hourly integration discrepancy
        run: |
          python audit/experiments/analyze_shetran_native_cobres.py /tmp/shetran-native-cobres
          for MMH in 10 20 30 40 50; do
            python audit/experiments/analyze_shetran_native_cobres.py "/tmp/shetran-native-cobres-rain${MMH}"
          done
      - name: Isolate rainfall and flow detachment with native 20mmh mechanism probes
        run: |
          python audit/experiments/shetran_native_mechanism_probes.py \
            --original-model original/examples/Cobres/model \
            --exe original/build/debug/bin/shetran \
            --workdir /tmp/shetran-mechanism-probes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cobres-48h-forensic-logs
          path: |
            /tmp/shetran-native-cobres/native_stdout.log
            /tmp/shetran-native-cobres/output_*txt
            /tmp/shetran-native-cobres/output_*csv
            /tmp/shetran-native-cobres/native_cobres_48h_diagnostics.json
            /tmp/shetran-native-cobres/output_*h5
            /tmp/shetran-native-cobres-rain*/native_stdout.log
            /tmp/shetran-native-cobres-rain*/output_*txt
            /tmp/shetran-native-cobres-rain*/output_*csv
            /tmp/shetran-native-cobres-rain*/output_*h5
            /tmp/shetran-native-cobres-rain*/native_cobres_48h_diagnostics.json
            /tmp/shetran-mechanism-probes/mechanism_summary.csv
            /tmp/shetran-mechanism-probes/*_diagnostics.json
          if-no-files-found: warn
          retention-days: 14
