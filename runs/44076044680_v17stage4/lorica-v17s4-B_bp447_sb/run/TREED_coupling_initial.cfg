# EVENT-SCALE ROOT COHESION CALIBRATION -- GENERATED, NOT MEASURED Tr
# baseline_rootC_sha256=7c69e323337009fe53b247496ad679e3926a4c9ec8571df9fff463a19fdba17e
# template_cfg_sha256=ce99ccc97d4f0724d3079b71d5343856eeb15016bbf665ab83e7893ac2f3916f
# calibration_profile=hales2009_wu_mean
# target_mean_root_cohesion_kPa=7.6
# baseline_mean_rootC_gC_m2=1181.40304199
# baseline_mean_root_biomass_kgDM_m2=2.5136234936
# inferred_effective_event_Tr_MPa=1.09678319248
# Reuse this fixed Tr_eff across scenarios; do NOT recalibrate each scenario.

# LORICA-TREED v0.5 annual two-way coupling
latitude_deg=38.0
CO2_ppm=420.0
evorate=0.10
dispersal_km=0.0

# Root-allocation mode:
#   fixed_original        = preserve original TREED r_s_r=1.0
#   adaptive_experimental = optimize r_s_r using the explicit PAW-access extension
root_allocation_mode=fixed_original

# Exploratory root-allocation optimization bounds (used only in adaptive mode)
r_s_r_min=0.25
r_s_r_max=4.0
r_s_r_initial=1.0

# Provisional PAW -> water-acquisition coupling. Keep explicit for sensitivity
# testing and replace/calibrate before scientific production use.
root_paw_access_halfsat=1.0
soil_water_coupling_strength=1.0
paw_release_days=365.0

# TREED cover -> LORICA ET multiplier. These span bare ground to the existing
# LORICA full-vegetation coefficient used for humid/forest vegetation.
treed_et_factor_bare=1.0
treed_et_factor_full_cover=0.85

# Used only if TREED_radiation_monthly.csv is absent/incomplete.
clt_fraction_default=0.5
rsds_W_m2_default=150.0

# Root biomass -> root cohesion: Hwang et al. (2015), Eq. (5)
#   Cr = K * Tr * Br / rho_r
# TREED root C [g C m-2] is converted to dry root biomass with f_C=0.47.
# Hwang measured rho_r=435.3 kg m-3 and used K=1.2.
#
# v0.4 adds Korean tree-root tensile-strength profiles. The default below uses
# the peer-reviewed mean for Pinus densiflora from Oh et al. (2011):
# 176.25 kgf cm-2 = 17.2842 MPa.
# Available peer-reviewed profiles:
#   pinus_densiflora_oh2011   = 17.2842 MPa
#   pinus_koraiensis_oh2011   = 16.2182 MPa
#   larix_kaempferi_oh2011    = 16.9439 MPa
#   quercus_mongolica_oh2011  = 21.9855 MPa
#   alnus_japonica_oh2011     = 21.0147 MPa
# Optional 2025 Korean conference sensitivity profiles:
#   pinus_densiflora_kim2025  = 15.9 MPa
#   pinus_koraiensis_kim2025  = 15.0 MPa
#   larix_kaempferi_kim2025   = 20.2 MPa
#   quercus_mongolica_kim2025 = 22.2 MPa
# Set profile=manual to use hwang_root_tensile_strength_MPa directly.
#
# IMPORTANT: Wu/Waldron-type estimates can exceed direct-shear reinforcement.
# Korean 2025 measurements reported Wu estimates 1.5-5.1x direct shear.
# Therefore reduction_factor is explicit. 1.0 reproduces the uncorrected Hwang
# biomass-to-cohesion conversion; sensitivity values 0.20-0.67 bracket the
# inverse of that observed overprediction range. Do not silently calibrate it.
hwang_root_carbon_fraction=0.47
hwang_root_density_kg_m3=435.3
hwang_K_m_inv=1.2
hwang_root_tensile_profile=manual
hwang_root_tensile_strength_MPa=1.0967831924785
hwang_root_cohesion_reduction_factor=1.0
hwang_root_cohesion_multiplier=1.0

# Runtime paths; relative paths resolve from this coupling directory.
julia_exe=julia
treed_project_dir=../TREED
driver_path=treed_lorica_driver_seeded_wrapper.jl

# LORICA rainfall-triggered shallow-landslide forcing.
# legacy_fraction_annual preserves the original interface.
# explicit_event uses mean rainfall_mm over duration_h.
landslide_event_mode=explicit_event
landslide_event_rainfall_mm=0.1
landslide_event_duration_h=6

treed_random_seed=20261113

root_reinforcement_mode=basal_profile
root_k_double_prime=0.4473684210526316
root_profile_truncation=soil_bottom

root_depth_mode=milly_stochastic
root_depth_cost_gC_m2_yr_per_m=14.0
treed_bare_bedrock_policy=zero_coupling
treed_ks_refresh_mode=annual
gounsa_experimental_landslide_recovery=off
